name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/republish (e.g. v0.2.0)"
        required: true

# Tag push is the primary trigger; workflow_dispatch re-runs against an
# already-pushed tag (e.g. to retry a failed signing step) - this workflow
# never creates or pushes tags itself, and never bumps versions.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # gh release create/upload needs write access; GITHUB_TOKEN defaults to read-only
    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Validate tag matches tauri.conf.json version
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Error "Tag '$tag' is not a valid vX.Y.Z semver tag"
            exit 1
          }
          $tagVersion = $Matches[1]
          $confVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $confVersion) {
            Write-Error "Tag version '$tagVersion' does not match tauri.conf.json version '$confVersion' - updates.rs compares the release tag against STEWRD_APP_VERSION at runtime, so these must always agree."
            exit 1
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
        id: version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli

      - name: npm ci
        run: npm ci

      - name: Build Notepad plugin bundle
        run: npm run plugin:build -- plugins/notepad

      - name: Build Template plugin bundle
        run: npm run plugin:build -- plugins/_template

      - name: Build Marketplace plugin bundle
        run: npm run plugin:build -- plugins/marketplace

      - name: Stage bundled plugins
        run: node scripts/stage-bundled-plugins.mjs

      - name: Build (signed)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      # Tauri's bundler patches stewrd.exe's PE resources (bundle-type
      # metadata) multiple times when building both MSI and NSIS targets,
      # and a patch pass after the last signCommand invocation strips the
      # signature that was just applied - confirmed via the v0.1.1 release
      # log (signed successfully at build time, but "No signature found"
      # once NSIS packaging finished). The NSIS installer itself stays
      # signed because it's produced fresh at the very end. Don't rely on
      # signCommand's in-build timing for the loose exe used in the update
      # zip - explicitly re-sign it here, after all bundling has finished.
      - name: Re-sign standalone exe
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: artifact-signing-cli -e https://eus.codesigning.azure.net/ -a topher-birth -c topher-birth -d stewrd src-tauri\target\release\stewrd.exe

      - name: Verify signatures
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Warning "signtool.exe not found - skipping signature verification"; exit 0 }
          & $signtool verify /pa "src-tauri\target\release\stewrd.exe"
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | ForEach-Object { & $signtool verify /pa $_.FullName }

      - name: Package update zip
        run: node scripts/package-update-zip.mjs ${{ steps.version.outputs.version }}

      - name: Sign update zip (minisign)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        # Deliberately not passed as -k/-p command-line flags: npx on Windows
        # runs via npx.cmd, a batch-file wrapper that re-parses arguments
        # through cmd.exe, which treats an embedded newline as a command
        # separator - the minisign private key is multi-line text
        # ("untrusted comment: ..." + the key on a second line), so passing
        # it inline silently truncates the command after the newline,
        # dropping the zip filename argument. Both flags are auto-read from
        # these env vars by the CLI itself (confirmed via `tauri signer sign
        # --help`: "[env: TAURI_SIGNING_PRIVATE_KEY=]" / "[env:
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD=]"), so no flags are needed.
        run: npx tauri signer sign stewrd-v${{ steps.version.outputs.version }}-windows.zip
        shell: pwsh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $installer = (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
          $zip = "stewrd-v${{ steps.version.outputs.version }}-windows.zip"
          $sig = "$zip.sig"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes
          }
          gh release upload $tag "$installer" "$zip" "$sig" --clobber
